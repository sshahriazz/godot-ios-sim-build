name: iOS simulator template (arm64)

on:
  workflow_dispatch:
    inputs:
      godot_ref:
        description: Godot tag or commit to build
        default: 4.7.2-stable
      build_release:
        description: Also build template_release
        type: boolean
        default: false
      metal:
        description: Keep the Metal driver on in the simulator build (GPU rendering instead of software OpenGL)
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out Godot
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ inputs.godot_ref }}
          path: godot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          pip install scons
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.ncpu

      - name: Keep Metal on for the simulator
        if: ${{ inputs.metal }}
        working-directory: godot
        run: |
          python3 - <<'PY'
          path = "platform/ios/detect.py"
          text = open(path).read()
          old = 'print_warning("iOS Simulator does not support the Metal rendering driver")\n        env["metal"] = False'
          assert old in text, "detect.py changed; update the patch"
          open(path, "w").write(text.replace(old, 'pass  # Metal kept on for the Apple Silicon simulator'))
          PY
          git diff --stat

      - name: Build template_debug (arm64 simulator)
        working-directory: godot
        run: scons platform=ios target=template_debug arch=arm64 simulator=yes -j"$(sysctl -n hw.ncpu)"

      - name: Build template_release (arm64 simulator)
        if: ${{ inputs.build_release }}
        working-directory: godot
        run: scons platform=ios target=template_release arch=arm64 simulator=yes -j"$(sysctl -n hw.ncpu)"

      - name: Check architectures
        working-directory: godot/bin
        run: |
          for f in *.a; do echo "$f -> $(lipo -archs "$f")"; done

      - uses: actions/upload-artifact@v4
        with:
          name: godot-${{ inputs.godot_ref }}-ios-arm64-simulator${{ inputs.metal && '-metal' || '' }}
          path: godot/bin/*.a
          retention-days: 30
